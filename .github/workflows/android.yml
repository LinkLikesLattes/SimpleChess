# Android (arm64) build of SimpleChess for UCI front-ends such as DroidFish.
#
# Cross-compiles with the Android NDK preinstalled on GitHub's Ubuntu runner image and links a
# fully static executable with the network EMBEDDED (EMBED_NET): a phone front-end or tournament
# harness can run it from the one file (no dynamic loader, no shared libc++, no net beside it).
#
# Static, NOT static-PIE. Android's position-independence rule is enforced by its dynamic linker,
# which a static executable never meets; the kernel loads a plain static ELF directly. A static-PIE
# is worse than unnecessary: Bionic's static startup code reads `main` and the init arrays through
# the GOT before anything applies the executable's own R_AARCH64_RELATIVE relocations, so it jumps
# through null and dies before main. 3.3.1 shipped that form and segfaulted at startup on phones.
#
# The run-test executes the SHIPPED file itself -- the stripped binary taken back out of the archive,
# alone in an empty directory -- under qemu-user, and searches four positions to depth 12 at 1
# thread; the node counts are printed for comparison with a native build of the same source (they
# match when the cross-compiled code is right). Nothing is relinked or rebuilt for the test.
#
# Two variants, because the int8 network layers have no NEON path without the Arm dot-product
# extension (src/nnue.cpp is guarded on __ARM_FEATURE_DOTPROD and otherwise falls back to scalar):
#   arm64          -march=armv8.2-a+dotprod   phone SoCs from ~2018 on (Cortex-A75/A55 and newer): the build to use
#   arm64-generic  -march=armv8-a             older 64-bit SoCs; correct, but the int8 layers run scalar, much slower
#
# Runs on demand and on release tags. The output is a run ARTIFACT (tar.gz of binary + install
# notes), deliberately never a release asset: releases stay source + net.
name: Android build

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # qemu_cpu: a real phone core of each class for the run-test, so the dotprod build is
        # proven on a core that has it and the generic build on one that does NOT (an
        # instruction the target lacks would SIGILL here instead of on a user's device).
        include:
          - variant: arm64
            march: armv8.2-a+dotprod
            qemu_cpu: cortex-a76
          - variant: arm64-generic
            march: armv8-a
            qemu_cpu: cortex-a53
    steps:
      - uses: actions/checkout@v7

      # NDK 28 or newer: NDK 27's static executables carry a TLS segment Bionic rejects at
      # startup ("TLS segment is underaligned"), so a build from it would not start on a phone.
      - name: Locate the NDK cross-compiler
        id: ndk
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          test -d "$NDK" || { echo "::error::no Android NDK on this runner (ANDROID_NDK_LATEST_HOME unset)"; exit 1; }
          REV=$(grep '^Pkg.Revision' "$NDK/source.properties" | head -1 | awk '{print $NF}')
          echo "NDK $REV at $NDK"
          test "${REV%%.*}" -ge 28 || { echo "::error::NDK $REV is too old (need 28+)"; exit 1; }
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CXX="$BIN/aarch64-linux-android24-clang++"
          test -x "$CXX" || { echo "::error::$CXX is missing"; ls "$BIN" | head -20; exit 1; }
          "$CXX" --version | head -1
          echo "cxx=$CXX" >> "$GITHUB_OUTPUT"
          echo "strip=$BIN/llvm-strip" >> "$GITHUB_OUTPUT"
          echo "ver=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # The Makefile takes the compiler and the target from the command line (CXX, ARCH) and
      # keeps its own optimisation set; EXTRA and LDFLAGS add only what Android needs. The
      # desktop hash default (4 GB, zero-filled at startup) is lowered for a phone; the
      # front-end sets Hash anyway. EMBED_NET bakes the repository's net into the binary.
      - name: Build (-march=${{ matrix.march }})
        run: |
          set -euo pipefail
          NET=$(ls nets/SCNNUEv*.scn5 | head -1); test -n "$NET" || { echo "::error::no net in nets/"; exit 1; }
          echo "embedding $NET"
          make -j"$(nproc)" CXX="${{ steps.ndk.outputs.cxx }}" ARCH="-march=${{ matrix.march }}" \
               EXTRA="-DSC_DEFAULT_HASH=64" EMBED_NET="$NET" LDFLAGS="-flto -pthread -static" 2>&1 | tee build.log
          grep -q -- "-march=${{ matrix.march }}" build.log || { echo "::error::target flag never reached a compile line"; exit 1; }
          grep -q -- "-DSC_EMBED_NET_PATH" build.log || { echo "::error::EMBED_NET never reached a compile line"; exit 1; }

      # A plain static executable: ET_EXEC, no PT_INTERP, no PT_DYNAMIC (so no dynamic relocations
      # for anything to apply at startup -- the static-PIE failure mode above cannot occur).
      - name: Verify the ELF, then strip it
        run: |
          set -euo pipefail
          file simplechess
          H=$(readelf -h simplechess)
          echo "$H" | grep -q 'Machine:.*AArch64' || { echo "::error::not an AArch64 ELF"; exit 1; }
          echo "$H" | grep -q 'Type:.*EXEC'        || { echo "::error::not a plain static executable (a static-PIE crashes at startup on Bionic)"; exit 1; }
          L=$(readelf -l simplechess)
          if echo "$L" | grep -q INTERP;  then echo "::error::binary wants a dynamic loader (not static)"; exit 1; fi
          if echo "$L" | grep -q DYNAMIC; then echo "::error::binary has a dynamic section (relocations to apply at startup)"; echo "$L"; exit 1; fi
          "${{ steps.ndk.outputs.strip }}" simplechess
          ls -l simplechess

      - name: Stage the archive (binary with embedded net + install notes)
        id: stage
        run: |
          set -euo pipefail
          NAME="simplechess-${{ steps.ndk.outputs.ver }}-android-${{ matrix.variant }}"
          mkdir -p "stage/$NAME"
          cp simplechess "stage/$NAME/"
          cp tools/ci/android-readme.txt "stage/$NAME/README-ANDROID.txt"
          tar -C stage -czf "$NAME.tar.gz" "$NAME"
          ls -l "$NAME.tar.gz"
          tar tzf "$NAME.tar.gz"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # The binary under test is unpacked from the archive being uploaded and sits ALONE in an
      # empty directory, run from that directory: it is byte-for-byte the shipped file, and the
      # only net it can possibly find is the embedded one -- the property the phone needs.
      - name: Run the shipped binary under qemu-user (${{ matrix.qemu_cpu }})
        env:
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static > /dev/null
          qemu-aarch64-static --version | head -1
          NAME="${{ steps.stage.outputs.name }}"
          mkdir -p unpack runtest
          tar -C unpack -xzf "$NAME.tar.gz"
          cp "unpack/$NAME/simplechess" runtest/simplechess
          cmp runtest/simplechess simplechess || { echo "::error::the file under test is not the shipped file"; exit 1; }
          sha256sum runtest/simplechess
          SMOKE="$PWD/tools/ci/uci_smoke.py"; BIN="$PWD/runtest/simplechess"
          if ! (cd runtest && python3 -u "$SMOKE" qemu-aarch64-static "$BIN" --depth 12 --timeout 900 | tee ../smoke.log); then
            echo "== run-test failed; startup syscall trace:"
            (cd runtest && qemu-aarch64-static -strace "$BIN" < /dev/null 2>&1 | tail -40) || true
            exit 1
          fi
          grep -q '(embedded)' smoke.log || { echo "::error::the engine did not load the EMBEDDED net"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.name }}.tar.gz
          if-no-files-found: error
          retention-days: 90

      # Post-mortem only: a build that failed the run-test is kept a week for inspection.
      - if: failure() && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.stage.outputs.name }}-FAILED-runtest
          path: ${{ steps.stage.outputs.name }}.tar.gz
          retention-days: 7
